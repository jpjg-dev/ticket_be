spring:
  config:
    import: optional:file:.env.test[.properties]

  cache:
    type: redis

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        highlight_sql: false
        use_sql_comments: false

  flyway:
    enabled: true

  kafka:
    bootstrap-servers: 127.0.0.1:9092

app:
  scheduling:
    enabled: false

logging:
  level:
    root: warn
    com.jipi.ticket_ledger: info
    org.springframework: warn
    org.hibernate: warn
    org.hibernate.SQL: off
    org.hibernate.orm.jdbc.bind: off

server:
  port: ${PORT}

jwt:
  secret: ${JWT_SECRET}

toss:
  payments:
    base-url: http://127.0.0.1:18080
    secret-key: ${TOSS_SECRET_KEY}

reservation:
  hold-duration: 30s
  expire-scheduler:
    fixed-delay-ms: 60000
    batch-size: 100

payment:
  recovery-scheduler:
    grace-ms: 60000
    fixed-delay-ms: 60000
    batch-size: 20
  outbox:
    relay:
      enabled: false
      fixed-delay: 1s
      batch-size: 20
      lease-duration: 30s
      send-timeout: 10s
      retry-initial-delay: 5s
      retry-max-delay: 5m
      unknown-max-attempts: 10
      topic: ticketledger-payment-events
      partitions: 3
      retention: 7d
  audit:
    consumer:
      enabled: false
      topic: ticketledger-payment-events
      group-id: ticketledger-payment-audit-v1
      concurrency: 1
      max-poll-records: 20
      idle-between-polls: 0ms
      database-retry-delay: 5s
      unknown-retry-delay: 1s
      unknown-max-attempts: 3
      max-payload-bytes: 65536
      dlt-topic: ticketledger-payment-audit-dlt
      topic-partitions: 3
  event-maintenance:
    enabled: false
    fixed-delay: 1h
    batch-size: 500
    outbox-published-retention: 14d
    inbox-retention: 90d
    dlt-retention: 30d

security:
  csrf-origin:
    allowed-origins:
      - http://localhost:3000
      - https://localhost:3000
      - https://ticketledger.dev

cache:
  featureflag:
    queue:
      mode:
        ttl: 5s
  event:
    list:
      ttl: 60s
    detail:
      ttl: 5m

queue:
  admission:
    batch-size: 15
    fixed-delay-ms: 1000
    entry-ttl: 30m
    admission-ttl: 2m
    claim-ttl: 30s
    stream-timeout: 5m
    stream-interval: 1s
    max-expected-backlog: 10000
    minimum-admission-rate-per-second: 10
    safety-margin: 5m
